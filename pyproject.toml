[build-system]
requires = ["setuptools>=75", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "imapledger"
dynamic = ["version"]
description = "Security-scoped IMAP automation with semantic decisions via pyjev"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Holger Nahrstaedt" }]
keywords = ["imap", "email", "automation", "pyjev", "spam"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Email",
]
dependencies = [
  "imapclient>=4.3,<5",
  "ledgercore>=0.6,<0.7",
  "pyjev>=0.1.2,<1",
  "vaultconfig>=0.3.2,<0.4",
  "typer>=0.16,<1",
  "rich>=13,<16",
  "tomli>=2; python_version < '3.11'",
  "tldextract>=5,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "ruff>=0.16,<1",
  "build>=1,<2",
  "twine>=6,<7",
]
keyring = ["vaultconfig[keyring]>=0.3.2,<0.4"]

[project.scripts]
imapledger = "imapledger.cli:app"

[project.urls]
Homepage = "https://github.com/ledgerwerk/imapledger"
Repository = "https://github.com/ledgerwerk/imapledger"
Issues = "https://github.com/ledgerwerk/imapledger/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["imapledger*"]

[tool.setuptools.package-data]
imapledger = ["decisions.toml", "py.typed"]

[tool.setuptools_scm]
version_file = "imapledger/_version.py"
fallback_version = "0.0.0"
parentdir_prefix_version = "imapledger-"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
